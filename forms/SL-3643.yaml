source:
  - url: "https://www.rfc-editor.org/rfc/rfc7468"
    section: "RFC 7468, Section 10"
    read_at: "2026-11-10"
    quote: "Unencrypted PKCS #8 Private Key Information Syntax structures (PrivateKeyInfo), renamed to Asymmetric Key Packages (OneAsymmetricKey), are encoded using the \"PRIVATE KEY\" label."
  - url: "https://www.rfc-editor.org/rfc/rfc9935"
    section: "RFC 9935, Section 3"
    read_at: "2026-11-10"
    quote: "id-alg-ml-kem-768 OBJECT IDENTIFIER ::= { kems 2 }"
  - url: "https://www.rfc-editor.org/rfc/rfc9935"
    section: "RFC 9935, Section 6"
    read_at: "2026-11-10"
    quote: "The both format contains both the seed and expanded private key, allowing for interoperability; some may want to use and retain the seed and others may only support expanded private keys."
  - url: "https://github.com/openssl/openssl/blob/openssl-3.5.0/doc/man7/EVP_PKEY-ML-KEM.pod"
    section: "EVP_PKEY-ML-KEM(7), \"ml-kem.output_formats\""
    read_at: "2026-11-10"
    quote: "The default order is equivalent to C<seed-priv> first and C<priv-only> second, with both seed and key output when the seed is available, and just the key otherwise."
status: "verified-run"
added_by: "John B Joseph (Purplecop Security)"
added_at: "2026-11-10"
notes: "Made with `openssl genpkey -algorithm ML-KEM-768` (OpenSSL 3.6.5), default provider settings: the privateKey is the RFC 9935 `both` CHOICE, a SEQUENCE of the 64-octet seed and the 2400-octet expanded key (OpenSSL's seed-priv, its default output when the seed is known). AlgorithmIdentifier is id-alg-ml-kem-768 (2.16.840.1.101.3.4.4.2) with no parameters. The label on the literal's line does not name the algorithm: the family is in the AlgorithmIdentifier of the DER body, so a scanner has to decode the body to report it. expected is the key in the body, reported on the BEGIN line, as for the other PEM rows. The body is real throwaway test material, published on purpose and used nowhere (README, \"Test keys\"; tools/make_test_keys.sh). verified-run: OpenSSL 3.6.5 reads the file back (`openssl pkey`/`openssl x509 -noout -text`) and `openssl asn1parse` shows the AlgorithmIdentifier above."
