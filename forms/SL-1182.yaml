form_kind: "config_value"
language_or_product: "Cisco IOS XE"
negative: false
literal: " authentication local rsa-sig"
context_filename: "running-config"
context_template: |
  crypto ikev2 profile PROF-1
   match identity remote address 192.0.2.1 255.255.255.255
   authentication local rsa-sig
   authentication remote pre-share
  !
  end
