notes: "pre-share on the remote side is a pre-shared key, not a public-key algorithm. The address is from the documentation range (RFC 5737). Promoted from candidates/ on 2026-11-10. The Cisco IOS XE configuration guide (cisco.com) refused a direct read (HTTP 403), so the source is Cisco's own published YANG model for IOS XE 17.18.1 (organization \"Cisco Systems, Inc.\"), whose leaf under 'authentication local' carries the CLI keyword verbatim. Config guide, not read: https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/sec-vpn/b-security-vpn/m_sec-cfg-ikev2-flex.html"
