id: "SL-7207"
title: "OpenSSL CLI: cms -encrypt a backup to an ECDH recipient (ecdh_kdf_md)"
family: "ECDH"
parameter_set: null
role: "key_establishment"
form_kind: "cli"
language_or_product: "OpenSSL CLI 3.5 (cms)"
negative: false
literal: "openssl cms -encrypt -in backup.tar -out backup.tar.cms -recip cert.pem -keyopt ecdh_kdf_md:sha256"
context_filename: "backup.sh"
context_template: |
  #!/bin/sh
  openssl cms -encrypt -in backup.tar -out backup.tar.cms -recip cert.pem -keyopt ecdh_kdf_md:sha256
expected:
  family: "ECDH"
  role: "key_establishment"
  size: "undetermined"
source:
  - url: "https://docs.openssl.org/3.5/man1/openssl-cms/"
    section: "OPTIONS: -keyopt name:parameter"
    read_at: "2026-11-10"
    quote: "It can currently be used to set RSA-PSS for signing, RSA-OAEP for encryption or to modify default parameters for ECDH."
  - url: "https://docs.openssl.org/3.5/man1/openssl-cms/"
    section: "EXAMPLES"
    read_at: "2026-11-10"
    quote: "Use SHA256 KDF with an ECDH certificate:"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-10"
notes: "ecdh_kdf_md is an ECDH key-agreement parameter (CMS KeyAgreeRecipientInfo); the curve is the recipient certificate's and is not pinned by the line."
