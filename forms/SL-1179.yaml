notes: "Promoted from candidates/ on 2026-11-10. The Cisco IOS XE configuration guide (cisco.com) refused a direct read (HTTP 403), so the source is Cisco's own published YANG model for IOS XE 17.18.1 (organization \"Cisco Systems, Inc.\"), whose native model mirrors the CLI: the IKEv2 proposal container 'group' has one leaf per CLI group number (leaf 'nineteen' for 'group 19'). The spelled-out leaf name to CLI number correspondence is read from the container, not quoted from a CLI page. Config guide, not read: https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/sec-vpn/b-security-vpn/m_sec-cfg-ikev2-flex.html"
