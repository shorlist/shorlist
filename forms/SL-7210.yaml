id: "SL-7210"
title: "GnuPG: add a nistp256 encryption subkey (ECDH)"
family: "ECDH"
parameter_set: "P-256"
role: "key_establishment"
form_kind: "cli"
language_or_product: "GnuPG 2.5 (gpg)"
negative: false
literal: "gpg --batch --quick-add-key \"$1\" nistp256 encr"
context_filename: "backup-key.sh"
context_template: |
  #!/bin/sh
  gpg --batch --quick-add-key "$1" nistp256 encr
expected:
  family: "ECDH"
  role: "key_establishment"
  size: 256
source:
  - url: "https://www.gnupg.org/documentation/manuals/gnupg/OpenPGP-Key-Management.html"
    section: "OpenPGP Key Management: --quick-add-key fpr [algo [usage [expire]]]"
    read_at: "2026-11-10"
    quote: "and “encr” for an encryption subkey"
  - url: "https://github.com/gpg/gnupg/blob/gnupg-2.5.24/g10/keygen.c"
    section: "parse_key_parameter_part: algorithm strings"
    read_at: "2026-11-10"
    quote: "nistp256:= ECDSA or ECDH using curve NIST P-256"
  - url: "https://github.com/gpg/gnupg/blob/gnupg-2.5.24/g10/keygen.c"
    section: "parse_key_parameter_part: FLAGS"
    read_at: "2026-11-10"
    quote: "encr := Allow usage Encrypt"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-10"
notes: "On NIST P-256 the usage decides the algorithm; 'encr' selects ECDH. The fingerprint is the script's first argument. The subkey is the one a later 'gpg --encrypt' to this key uses; 'gpg --encrypt -r' itself pins no family."
