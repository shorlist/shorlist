id: "SL-7204"
title: "PostgreSQL 17: ssl_ecdh_curve prime256v1"
family: "ECDH"
parameter_set: "P-256"
role: "key_establishment"
form_kind: "config_value"
language_or_product: "PostgreSQL 17 (postgresql.conf)"
negative: false
literal: "ssl_ecdh_curve = 'prime256v1'"
context_filename: "postgresql.conf"
context_template: |
  listen_addresses = '*'
  ssl = on
  ssl_cert_file = 'server.crt'
  ssl_key_file = 'server.key'
  ssl_ecdh_curve = 'prime256v1'
expected:
  family: "ECDH"
  role: "key_establishment"
  size: 256
source:
  - url: "https://www.postgresql.org/docs/17/runtime-config-connection.html"
    section: "19.3.3 SSL: ssl_ecdh_curve (string)"
    read_at: "2026-11-10"
    quote: "Specifies the name of the curve to use in ECDH key exchange."
  - url: "https://www.postgresql.org/docs/17/runtime-config-connection.html"
    section: "19.3.3 SSL: ssl_ecdh_curve (string)"
    read_at: "2026-11-10"
    quote: "prime256v1 (NIST P-256)"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
