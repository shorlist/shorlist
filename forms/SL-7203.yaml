notes: "Hybrid: scored on the post-quantum half (ML-KEM), as SL-0011. PostgreSQL passes the value to OpenSSL; the group is accepted when the linked OpenSSL supports it (3.5 or later). PostgreSQL's page does not list the group itself. The certificate and key file names are placeholders and carry no algorithm."
