notes: "OPC Foundation's .NET reference stack (UA-.NETStandard 2.0.1) application configuration; the policy URI is the one defined in OPC 10000-7 and is the same in every OPC UA stack. ECDSA signs and an ephemeral P-256 key agrees the secret: both roles, so the family is EC."
