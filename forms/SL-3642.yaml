status: "verified-run"
added_by: "John B Joseph (Purplecop Security)"
added_at: "2026-11-10"
notes: "Made with `openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -sha256 -subj \"/CN=ShorList test P-256\" -days 3650` (OpenSSL 3.6.5); the private key was discarded. The subject key is id-ecPublicKey on prime256v1 and the certificate is signed with ecdsa-with-SHA256, which pins ECDSA. The label on the literal's line does not name the algorithm: the family is in the AlgorithmIdentifier of the DER body, so a scanner has to decode the body to report it. expected is the key in the body, reported on the BEGIN line, as for the other PEM rows. The body is real throwaway test material, published on purpose and used nowhere (README, \"Test keys\"; tools/make_test_keys.sh). verified-run: OpenSSL 3.6.5 reads the file back (`openssl pkey`/`openssl x509 -noout -text`) and `openssl asn1parse` shows the AlgorithmIdentifier above."
