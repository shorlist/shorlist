id: "SL-3640"
title: "PEM label \"PUBLIC KEY\": RSA-2048 SubjectPublicKeyInfo"
family: "RSA"
parameter_set: "2048"
role: "both"
form_kind: "file_format"
language_or_product: "PEM / OpenSSL 3.5"
negative: false
literal: "-----BEGIN PUBLIC KEY-----"
context_filename: "key.pem"
context_template: |
  -----BEGIN PUBLIC KEY-----
