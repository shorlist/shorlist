source:
  - url: "https://www.rfc-editor.org/rfc/rfc7468"
    section: "RFC 7468, Section 13"
    read_at: "2026-11-10"
    quote: "Public keys are encoded using the \"PUBLIC KEY\" label."
  - url: "https://www.rfc-editor.org/rfc/rfc8017"
    section: "RFC 8017, Appendix A.1"
    read_at: "2026-11-10"
    quote: "rsaEncryption    OBJECT IDENTIFIER ::= { pkcs-1 1 }"
