    quote: "# define PEM_STRING_PUBLIC       \"PUBLIC KEY\""
status: "verified-run"
added_by: "John B Joseph (Purplecop Security)"
added_at: "2026-11-10"
notes: "Made with `openssl pkey -pubout` from a fresh RSA-2048 key whose private half was discarded (OpenSSL 3.6.5): SubjectPublicKeyInfo (RFC 5280, Section 4.1.2.7), not the PKCS #1 RSA PUBLIC KEY of SL-3597. The label on the literal's line does not name the algorithm: the family is in the AlgorithmIdentifier of the DER body, so a scanner has to decode the body to report it. expected is the key in the body, reported on the BEGIN line, as for the other PEM rows. The body is real throwaway test material, published on purpose and used nowhere (README, \"Test keys\"; tools/make_test_keys.sh). verified-run: OpenSSL 3.6.5 reads the file back (`openssl pkey`/`openssl x509 -noout -text`) and `openssl asn1parse` shows the AlgorithmIdentifier above."
