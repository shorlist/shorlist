source:
  - url: "https://www.rfc-editor.org/rfc/rfc7468"
    section: "RFC 7468, Section 5.1"
    read_at: "2026-11-10"
    quote: "Public-key certificates are encoded using the \"CERTIFICATE\" label."
  - url: "https://www.rfc-editor.org/rfc/rfc9881"
    section: "RFC 9881, Section 2"
    read_at: "2026-11-10"
    quote: "id-ml-dsa-65 OBJECT IDENTIFIER ::= { joint-iso-itu-t(2) country(16) us(840) organization(1) gov(101) csor(3) nistAlgorithm(4) sigAlgs(3) id-ml-dsa-65(18) }"
  - url: "https://github.com/openssl/openssl/blob/openssl-3.5.0/include/openssl/pem.h"
    section: "include/openssl/pem.h: PEM_STRING_X509"
    read_at: "2026-11-10"
    quote: "# define PEM_STRING_X509         \"CERTIFICATE\""
status: "verified-run"
added_by: "John B Joseph (Purplecop Security)"
added_at: "2026-11-10"
notes: "Made with `openssl req -x509 -newkey ML-DSA-65 -nodes -subj \"/CN=ShorList test ML-DSA-65\" -days 3650` (OpenSSL 3.6.5); the private key was discarded. Subject key and signature algorithm are both id-ml-dsa-65 (RFC 9881, Sections 3 and 4). The label on the literal's line does not name the algorithm: the family is in the AlgorithmIdentifier of the DER body, so a scanner has to decode the body to report it. expected is the key in the body, reported on the BEGIN line, as for the other PEM rows. The body is real throwaway test material, published on purpose and used nowhere (README, \"Test keys\"; tools/make_test_keys.sh). verified-run: OpenSSL 3.6.5 reads the file back (`openssl pkey`/`openssl x509 -noout -text`) and `openssl asn1parse` shows the AlgorithmIdentifier above."
