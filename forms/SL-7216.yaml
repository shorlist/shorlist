id: "SL-7216"
title: "jarsigner: -sigalg Ed25519"
family: "EdDSA"
parameter_set: "Ed25519"
role: "signature"
form_kind: "cli"
language_or_product: "Java / jarsigner (JDK 25)"
negative: false
literal: "jarsigner -keystore ks.p12 -storepass changeit -sigalg Ed25519 app.jar signer"
context_filename: "sign.sh"
context_template: |
  #!/bin/sh
  jarsigner -keystore ks.p12 -storepass changeit -sigalg Ed25519 app.jar signer
expected:
  family: "EdDSA"
  role: "signature"
  size: "undetermined"
source:
  - url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/jarsigner.html"
    section: "jarsigner(1) JDK 25, Options for jarsigner: -sigalg algorithm"
    read_at: "2026-11-10"
    quote: "Specifies the name of the signature algorithm to use to sign the JAR file."
  - url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/jarsigner.html"
    section: "Default Signature Algorithms and Block File Extensions"
    read_at: "2026-11-10"
    quote: "EdDSA 255 Ed25519 .EC"
  - url: "https://docs.oracle.com/en/java/javase/25/docs/specs/security/standard-names.html"
    section: "KeyPairGenerator Algorithms"
    read_at: "2026-11-10"
    quote: "Keys for Edwards-Curve signature algorithm with Ed25519 as defined in RFC 8032"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-10"
notes: "The keystore file name and alias are placeholders; the key in it must match the algorithm, so the line pins the family."
