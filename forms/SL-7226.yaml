id: "SL-7226"
title: "Linkerd trust anchor: step certificate create --kty EC --crv P-256"
family: "ECDSA"
parameter_set: "P-256"
role: "signature"
form_kind: "cli"
language_or_product: "Linkerd 2 / smallstep step CLI"
negative: false
literal: "step certificate create root.linkerd.cluster.local ca.crt ca.key --profile root-ca --no-password --insecure --kty EC --crv P-256"
context_filename: "trust-anchor.sh"
context_template: |
  #!/bin/sh
  step certificate create root.linkerd.cluster.local ca.crt ca.key --profile root-ca --no-password --insecure --kty EC --crv P-256
expected:
  family: "ECDSA"
  role: "signature"
  size: 256
source:
  - url: "https://linkerd.io/2-edge/tasks/generate-certificates/"
    section: "Generating your own mTLS root certificates"
    read_at: "2026-11-10"
    quote: "All certificates must use the ECDSA P-256 algorithm which is the default for step ."
  - url: "https://smallstep.com/docs/step-cli/reference/certificate/create/"
    section: "step certificate create: --kty, --crv"
    read_at: "2026-11-10"
    quote: "EC : Create an elliptic curve key pair"
  - url: "https://smallstep.com/docs/step-cli/reference/certificate/create/"
    section: "step certificate create: --kty, --crv"
    read_at: "2026-11-10"
    quote: "P-256 : NIST P-256 Curve"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-10"
notes: "Linkerd's documented command relies on step's defaults (EC, P-256) and names no algorithm; this row writes them out, which is what pins the family on the line. The trust anchor signs the issuer certificate, hence ECDSA."
